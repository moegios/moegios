name: "Moegi OS Plasma Edition"

desktop:
  environment: plasma
  session: wayland
  display_manager: sddm

theme:
  global_theme: breeze
  color_scheme: breeze-light
  accent: green
  application_style: breeze
  plasma_style: breeze
  window_decoration: breeze
  icons: breeze
  cursor: breeze-light
  sounds: ocean
  splash: breeze
  login_theme: breeze

panel:
  position: bottom
  floating: false
  height: 44

virtual_desktops:
  count: 2

locale:
  language: ja_JP.UTF-8
  timezone: Asia/Tokyo
  keyboard: jp
  user_directories: english

input:
  framework: fcitx5
  engine: mozc

flatpak:
  enabled: true
  flathub: true

installer:
  name: calamares
