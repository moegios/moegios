project:
  id: moegi
  name: "Moegi OS"
  version: "0.1"
  status: "development"

identity:
  origin: "Moegi"
  description: "A custom Linux distribution project focused on KDE Plasma and a ready-to-use Japanese desktop environment."

branding:
  logo: "common/branding/moegi-os-logo.png"
  wallpaper: "common/branding/wallpaper.png"

defaults:
  edition: plasma
  locale: ja_JP.UTF-8
  timezone: Asia/Tokyo
  keyboard: jp

repository:
  layout: monorepo
  multi_distro: true
